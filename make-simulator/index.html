<!DOCTYPE html>
<html lang="th" class="transition-colors duration-500">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>YenPocket - NecoMart Edition</title>
    
    <meta name="theme-color" content="#4F46E5">
    <link rel="apple-touch-icon" href="./icon-192.png">
    <link rel="manifest" href="manifest.json">
    
    <script>
        // Init Dark Mode
        (function() {
            const savedTheme = localStorage.getItem('theme');
            const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (savedTheme === 'dark' || (!savedTheme && systemPrefersDark)) {
                document.documentElement.classList.add('dark');
            }
        })();
    </script>

    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Prompt', 'sans-serif'] },
                    colors: {
                        primary: '#4F46E5', // Indigo 600
                        secondary: '#10B981', // Emerald 500 (For JPY)
                        darkBg: '#0f172a', // Slate 900
                        darkCard: '#1e293b', // Slate 800
                    }
                }
            }
        }
    </script>

    <style>
        body {
            -webkit-font-smoothing: antialiased;
            background-image: 
                radial-gradient(at 0% 0%, hsla(253,16%,7%,0.03) 0, transparent 50%), 
                radial-gradient(at 50% 0%, hsla(225,39%,30%,0.03) 0, transparent 50%), 
                radial-gradient(at 100% 0%, hsla(339,49%,30%,0.03) 0, transparent 50%);
            background-attachment: fixed;
        }

        html.dark body {
            background-image: 
                radial-gradient(at 0% 0%, rgba(79, 70, 229, 0.1) 0, transparent 50%), 
                radial-gradient(at 100% 0%, rgba(16, 185, 129, 0.05) 0, transparent 50%);
        }

        /* Hide Number Input Arrows */
        .hide-arrows::-webkit-outer-spin-button, .hide-arrows::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        .hide-arrows { -moz-appearance: textfield; appearance: textfield; }

        /* Animations */
        @keyframes popIn { 0% { transform: scale(0.9) translateY(10px); opacity: 0; } 100% { transform: scale(1) translateY(0); opacity: 1; } }
        .animate-pop { opacity: 0; animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        
        /* Glass Cards */
        .glass-card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 10px 40px -10px rgba(0,0,0,0.05);
        }
        
        html.dark .glass-card {
            background: rgba(30, 41, 59, 0.8); /* Slate 800 */
            border: 1px solid rgba(51, 65, 85, 0.6); /* Slate 700 */
            box-shadow: 0 10px 40px -10px rgba(0,0,0,0.3);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        html.dark ::-webkit-scrollbar-thumb { background: #475569; }
    </style>
</head>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged, GoogleAuthProvider, signInWithPopup, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // --- App Config & State ---
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'necomart-app';
        const API_URL = "https://open.er-api.com/v6/latest/JPY";
        
        let auth, db, user = null;
        let isInitialLoad = true;
        let jpyToThbRate = 0;
        let activeSessionUnsubscribe = null;

        let appData = {
            totalBudget: 0,
            pockets: []
        };

        const MY_FIREBASE_CONFIG = {
            apiKey: "AIzaSyD-Vgayvdkl165ZO6kYCfv2OOfvZHqB59g",
            authDomain: "necomart-github.firebaseapp.com",
            projectId: "necomart-github",
            storageBucket: "necomart-github.firebasestorage.app",
            messagingSenderId: "181730496545",
            appId: "1:181730496545:web:022815a30d6aafd4c65360"
        };

        // --- Helpers ---
        window.showToast = function(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = msg;
            toast.classList.replace('-translate-y-24', 'translate-y-0');
            toast.classList.replace('opacity-0', 'opacity-100');
            setTimeout(() => {
                toast.classList.replace('translate-y-0', '-translate-y-24');
                toast.classList.replace('opacity-100', 'opacity-0');
            }, 3000);
        };

        function hideLoading() {
            const loader = document.getElementById('loading-screen');
            if (loader) {
                loader.style.opacity = '0';
                setTimeout(() => loader.remove(), 700);
            }
        }

        // --- Firebase Init ---
        async function initFirebase() {
            let firebaseConfigToUse = null;
            if (typeof __firebase_config !== 'undefined') {
                firebaseConfigToUse = JSON.parse(__firebase_config);
            } else {
                firebaseConfigToUse = MY_FIREBASE_CONFIG;
            }

            try {
                const fApp = initializeApp(firebaseConfigToUse);
                auth = getAuth(fApp);
                db = getFirestore(fApp);

                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth).catch(()=>{});
                }

                setupAuthUI();

                onAuthStateChanged(auth, (u) => {
                    user = u;
                    updateAuthUI();
                    
                    if (user && !user.isAnonymous) {
                        listenToCloudData();
                    } else {
                        loadOfflineData();
                    }
                });
            } catch(e) {
                console.error("Firebase Init Failed", e);
                loadOfflineData();
            }
        }

        function setupAuthUI() {
            const provider = new GoogleAuthProvider();
            document.getElementById('google-login-btn').addEventListener('click', async () => {
                try {
                    document.getElementById('google-login-btn').innerHTML = "⏳ รอแป๊บ...";
                    await signInWithPopup(auth, provider);
                    showToast("✅ ล็อกอินสำเร็จ!");
                } catch (error) {
                    showToast("❌ ล็อกอินไม่สำเร็จ");
                    updateAuthUI();
                }
            });

            document.getElementById('logout-btn').addEventListener('click', async () => {
                document.getElementById('logout-btn').innerText = "ออก...";
                await signOut(auth);
                setTimeout(() => window.location.reload(), 300);
            });
        }

        function updateAuthUI() {
            const loginBtn = document.getElementById('google-login-btn');
            const profile = document.getElementById('user-profile');
            
            if (user && !user.isAnonymous) {
                loginBtn.classList.add('hidden');
                profile.classList.remove('hidden');
                profile.classList.add('flex');
                document.getElementById('user-avatar').src = user.photoURL || '';
                document.getElementById('user-name').innerText = user.displayName?.split(' ')[0] || 'ผู้ใช้';
            } else {
                loginBtn.classList.remove('hidden');
                profile.classList.add('hidden');
                profile.classList.remove('flex');
                loginBtn.innerHTML = `<span class="bg-white dark:bg-slate-800 text-primary w-5 h-5 rounded-full flex items-center justify-center text-[10px] font-black shadow-sm">G</span> <span class="hidden sm:inline">ล็อกอิน</span>`;
            }
        }

        // --- Data Management (Sync / Local) ---
        function loadOfflineData() {
            const saved = localStorage.getItem('make_pocket_data');
            if (saved) {
                try {
                    appData = JSON.parse(saved);
                } catch(e) {}
            }
            if (appData.pockets.length === 0 && isInitialLoad) {
                // Default pockets for new users
                appData.pockets = [
                    { id: 1, name: "อาหาร 🍱", icon: "🍱", balance: 0 },
                    { id: 2, name: "ช้อปปิ้ง 🛍️", icon: "🛍️", balance: 0 }
                ];
            }
            renderUI();
            hideLoading();
            isInitialLoad = false;
        }

        function listenToCloudData() {
            if (!user || user.isAnonymous) return;
            const ref = doc(db, 'artifacts', appId, 'users', user.uid, 'make_pockets', 'main');
            
            if(activeSessionUnsubscribe) activeSessionUnsubscribe();
            
            activeSessionUnsubscribe = onSnapshot(ref, (snap) => {
                if (snap.exists()) {
                    appData = snap.data();
                    
                    // Offline Merge Logic: If just logged in, check if we have offline data to push
                    if (isInitialLoad) {
                        const localSaved = localStorage.getItem('make_pocket_data');
                        if (localSaved) {
                            const localData = JSON.parse(localSaved);
                            // Simple merge: if local has more total budget or pockets, assume it's newer/wanted
                            if (localData.totalBudget > 0 || localData.pockets.length > 0) {
                                if(confirm("พบข้อมูลกระเป๋าที่จดค้างไว้ตอนออฟไลน์ ต้องการใช้ข้อมูลนี้ทับบน Cloud หรือไม่?")) {
                                    appData = localData;
                                    saveData(false); // Force push to cloud
                                }
                            }
                            localStorage.removeItem('make_pocket_data');
                        }
                    }
                } else if (isInitialLoad) {
                    // First time on cloud, push local data up
                    const localSaved = localStorage.getItem('make_pocket_data');
                    if (localSaved) appData = JSON.parse(localSaved);
                    saveData(false);
                }
                
                renderUI();
                hideLoading();
                isInitialLoad = false;
            }, (err) => {
                console.error(err);
                loadOfflineData();
            });
        }

        window.saveData = function(reRender = true) {
            // Update UI elements strictly without losing input focus if reRender is false
            if (user && !user.isAnonymous && db) {
                const ref = doc(db, 'artifacts', appId, 'users', user.uid, 'make_pockets', 'main');
                setDoc(ref, appData).catch(()=>{});
            } else {
                localStorage.setItem('make_pocket_data', JSON.stringify(appData));
            }
            if (reRender) renderUI();
            else updateSummaryDisplay();
        };

        // --- Core Logic & API ---
        async function fetchRate() {
            const badge = document.getElementById('rate-badge');
            try {
                const res = await fetch(API_URL);
                const data = await res.json();
                jpyToThbRate = data.rates.THB;
                localStorage.setItem('cachedJpyRate', jpyToThbRate);
                
                const rate100 = (jpyToThbRate * 100).toFixed(2);
                badge.classList.remove('animate-pulse', 'bg-emerald-50', 'text-emerald-600', 'border-emerald-200', 'dark:bg-emerald-900/30', 'dark:text-emerald-400', 'dark:border-emerald-800');
                badge.classList.add('bg-white', 'dark:bg-slate-800', 'text-slate-700', 'dark:text-slate-300', 'border-slate-200', 'dark:border-slate-700');
                badge.innerHTML = `<span class="text-[10px] text-slate-400 dark:text-slate-500">เรทวันนี้:</span> <span class="font-black text-secondary">100¥ = ฿${rate100}</span>`;
                
                renderUI();
            } catch (error) {
                const cached = localStorage.getItem('cachedJpyRate');
                if (cached) {
                    jpyToThbRate = parseFloat(cached);
                    badge.classList.remove('animate-pulse');
                    badge.innerHTML = `⚠️ <span class="text-yellow-600">ใช้ออฟไลน์โหมด</span>`;
                    renderUI();
                }
            }
        }

        function getUnallocated() {
            const allocated = appData.pockets.reduce((sum, p) => sum + (p.balance || 0), 0);
            return (appData.totalBudget || 0) - allocated;
        }

        function convertThbToJpy(thbAmount) {
            if (!jpyToThbRate || jpyToThbRate <= 0) return 0;
            return Math.floor(thbAmount / jpyToThbRate);
        }

        function formatNum(num) {
            return Number(num).toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
        }

        // --- UI Rendering ---
        const totalBudgetInput = document.getElementById('inline-total-budget');
        
        totalBudgetInput.addEventListener('input', (e) => {
            appData.totalBudget = parseFloat(e.target.value) || 0;
            saveData(false); 
        });

        totalBudgetInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') e.target.blur();
        });

        function updateSummaryDisplay() {
            const unallocatedThb = getUnallocated();
            
            document.getElementById('unallocated-thb').innerText = formatNum(unallocatedThb);
            document.getElementById('unallocated-jpy').innerText = formatNum(convertThbToJpy(unallocatedThb));

            const mainEl = document.getElementById('unallocated-thb');
            if (unallocatedThb === 0 && appData.totalBudget > 0) {
                mainEl.className = "text-5xl font-black tracking-tight transition-colors duration-300 text-slate-300 dark:text-slate-600";
            } else if (unallocatedThb < 0) {
                mainEl.className = "text-5xl font-black tracking-tight transition-colors duration-300 text-red-500 animate-pulse";
            } else {
                mainEl.className = "text-5xl font-black tracking-tight transition-colors duration-300 text-slate-800 dark:text-white";
            }
        }

        function renderUI() {
            if (document.activeElement !== totalBudgetInput) {
                totalBudgetInput.value = appData.totalBudget || '';
            }

            updateSummaryDisplay();

            const container = document.getElementById('pockets-container');
            container.innerHTML = '';

            if (appData.pockets.length === 0) {
                container.innerHTML = `<div class="col-span-full text-center py-10 text-slate-400 dark:text-slate-500 font-bold">ยังไม่มีกระเป๋าเงิน กดสร้างได้เลย!</div>`;
                return;
            }

            appData.pockets.forEach((pocket, index) => {
                const jpyVal = convertThbToJpy(pocket.balance);
                const percent = appData.totalBudget > 0 ? (pocket.balance / appData.totalBudget) * 100 : 0;

                const card = document.createElement('div');
                card.className = 'glass-card rounded-3xl p-5 animate-pop relative overflow-hidden group border border-slate-200 dark:border-slate-700';
                card.style.animationDelay = `${index * 0.05}s`;

                card.innerHTML = `
                    <div class="absolute bottom-0 left-0 h-1.5 bg-indigo-100 dark:bg-slate-800 w-full">
                        <div class="h-full bg-primary transition-all duration-1000 ease-out" style="width: ${Math.min(percent, 100)}%"></div>
                    </div>

                    <div class="flex justify-between items-start mb-4 relative z-10">
                        <div class="flex items-center gap-3">
                            <div class="w-12 h-12 rounded-2xl bg-white dark:bg-slate-800 shadow-sm flex items-center justify-center text-2xl border border-slate-100 dark:border-slate-700">
                                ${pocket.icon || '🍱'}
                            </div>
                            <div>
                                <h3 class="font-bold text-slate-800 dark:text-white text-lg leading-tight cursor-pointer hover:text-primary dark:hover:text-indigo-400 transition-colors" onclick="openEditPocketModal(${pocket.id})" title="แตะเพื่อแก้ไข">${pocket.name}</h3>
                                <div class="text-[10px] font-bold text-slate-400 dark:text-slate-500">กินพื้นที่ ${percent.toFixed(1)}% ของงบ</div>
                            </div>
                        </div>
                        <button onclick="openEditPocketModal(${pocket.id})" class="text-slate-400 hover:text-primary dark:hover:text-white bg-white dark:bg-slate-800 hover:bg-indigo-50 dark:hover:bg-indigo-900/30 w-8 h-8 rounded-full flex items-center justify-center transition-colors shadow-sm border border-slate-100 dark:border-slate-700 text-sm" title="จัดการกระเป๋า">
                            ⚙️
                        </button>
                    </div>

                    <div class="bg-slate-50 dark:bg-slate-900/50 p-4 rounded-2xl flex flex-col border border-slate-200 dark:border-slate-700 mt-2 relative z-10 focus-within:border-primary dark:focus-within:border-indigo-500 focus-within:ring-2 focus-within:ring-indigo-100 dark:focus-within:ring-indigo-900/50 transition-all shadow-inner">
                        <div class="text-[10px] font-bold text-slate-400 dark:text-slate-500 mb-1 uppercase tracking-widest">ยอดเงินในกระเป๋า</div>
                        <div class="flex items-center gap-2">
                            <span class="text-2xl font-bold text-slate-400 dark:text-slate-500">฿</span>
                            <input type="number" id="pocket-balance-${pocket.id}" value="${pocket.balance}" 
                                class="hide-arrows w-full bg-transparent text-3xl font-black text-slate-800 dark:text-white outline-none"
                                onblur="updatePocketBalance(${pocket.id}, this.value)"
                                onkeydown="if(event.key==='Enter') this.blur();"
                                onfocus="this.select()">
                        </div>
                        <div class="flex items-center gap-1.5 mt-2 pt-2 border-t border-slate-200 dark:border-slate-700/50">
                            <span class="text-xs font-bold text-emerald-600 dark:text-emerald-400 bg-emerald-50 dark:bg-emerald-900/30 px-2 py-0.5 rounded border border-emerald-100 dark:border-emerald-800/50">
                                ≈ ¥${formatNum(jpyVal)}
                            </span>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // --- Edit Balance Directly ---
        window.updatePocketBalance = function(pocketId, newValueStr) {
            const pocket = appData.pockets.find(p => p.id === pocketId);
            if (!pocket) return;
            
            let newValue = parseFloat(newValueStr);
            if (isNaN(newValue) || newValue < 0) {
                newValue = 0;
            }

            // ลบการบล็อคออก เพื่อให้ยอดเงินรวมทะลุไปติดลบได้เลย
            pocket.balance = newValue;
            saveData();
        };

        // --- Modals Logic ---
        window.openModal = function(id) {
            const modal = document.getElementById(id);
            const content = modal.firstElementChild;
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                content.classList.remove('scale-95');
            }, 10);
        };

        window.closeModal = function(id) {
            const modal = document.getElementById(id);
            const content = modal.firstElementChild;
            modal.classList.add('opacity-0');
            content.classList.add('scale-95');
            setTimeout(() => { modal.classList.add('hidden'); }, 300);
        };

        // --- Create Pocket ---
        const emojis = ['🍱', '🍜', '☕', '🛒', '🛍️', '🎮', '💊', '🚂', '🏨', '🎡', '⛩️', '🎁'];
        window.openAddPocketModal = function() {
            const picker = document.getElementById('emoji-picker');
            picker.innerHTML = emojis.map(e => `
                <button onclick="selectEmoji('${e}', this)" class="text-2xl hover:bg-slate-100 dark:hover:bg-slate-700 p-2 rounded-xl transition-colors emoji-btn ${e==='🍱' ? 'bg-indigo-50 dark:bg-indigo-900/30 border border-indigo-200 dark:border-indigo-700' : 'border border-transparent'}">${e}</button>
            `).join('');
            document.getElementById('new-pocket-icon').value = '🍱';
            document.getElementById('new-pocket-name').value = '';
            openModal('create-pocket-modal');
            setTimeout(() => document.getElementById('new-pocket-name').focus(), 100);
        };

        window.selectEmoji = function(emoji, btn) {
            document.getElementById('new-pocket-icon').value = emoji;
            document.querySelectorAll('.emoji-btn').forEach(b => b.className = 'text-2xl hover:bg-slate-100 dark:hover:bg-slate-700 p-2 rounded-xl transition-colors emoji-btn border border-transparent');
            btn.className = 'text-2xl hover:bg-slate-100 dark:hover:bg-slate-700 p-2 rounded-xl transition-colors emoji-btn bg-indigo-50 dark:bg-indigo-900/30 border border-indigo-200 dark:border-indigo-700';
        };

        window.saveNewPocket = function() {
            const name = document.getElementById('new-pocket-name').value.trim();
            const icon = document.getElementById('new-pocket-icon').value;
            if (!name) { showToast('กรุณาตั้งชื่อกระเป๋า'); return; }
            
            const newId = appData.pockets.length > 0 ? Math.max(...appData.pockets.map(p => p.id)) + 1 : 1;
            appData.pockets.push({ id: newId, name, icon, balance: 0 });
            saveData();
            closeModal('create-pocket-modal');
            showToast('สร้างกระเป๋าใหม่แล้ว');
        };

        // --- Edit / Delete Pocket ---
        window.openEditPocketModal = function(id) {
            const pocket = appData.pockets.find(p => p.id === id);
            if(!pocket) return;
            
            document.getElementById('edit-pocket-id').value = id;
            document.getElementById('edit-pocket-name').value = pocket.name;
            
            openModal('edit-pocket-modal');
            setTimeout(() => document.getElementById('edit-pocket-name').focus(), 100);
        };

        window.saveEditPocket = function() {
            const id = parseInt(document.getElementById('edit-pocket-id').value);
            const newName = document.getElementById('edit-pocket-name').value.trim();
            
            if (!newName) { showToast('กรุณาตั้งชื่อกระเป๋า'); return; }
            
            const pocket = appData.pockets.find(p => p.id === id);
            if(pocket) {
                pocket.name = newName;
                saveData();
                closeModal('edit-pocket-modal');
            }
        };

        window.deletePocketFromEdit = function() {
            const id = parseInt(document.getElementById('edit-pocket-id').value);
            const pocket = appData.pockets.find(p => p.id === id);
            if(!pocket) return;

            if (confirm(`คุณแน่ใจนะว่าต้องการลบกระเป๋า "${pocket.name}"?\nเงิน ฿${formatNum(pocket.balance)} จะถูกคืนกลับไปยัง "เงินรอจัดสรร" ทันที`)) {
                appData.pockets = appData.pockets.filter(p => p.id !== id);
                saveData();
                closeModal('edit-pocket-modal');
                showToast('ลบกระเป๋าเรียบร้อย');
            }
        };

        // --- Theme Toggle Action ---
        document.getElementById('theme-btn').addEventListener('click', () => {
            const html = document.documentElement;
            const isDark = html.classList.contains('dark');
            html.classList.toggle('dark', !isDark);
            document.getElementById('theme-icon').innerText = !isDark ? '🌙' : '☀️';
            localStorage.setItem('theme', !isDark ? 'dark' : 'light');
        });

        // Initialize Theme Icon Correctly
        if (document.documentElement.classList.contains('dark')) {
            document.getElementById('theme-icon').innerText = '🌙';
        }

        // --- Service Worker Registration (PWA & Offline) ---
        if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.protocol === 'http:')) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(err => {
                    console.log('Service Worker registration failed: ', err);
                });
            });
        }

        // --- Start Application ---
        fetchRate();
        initFirebase();

    </script>
</body>
</html>
