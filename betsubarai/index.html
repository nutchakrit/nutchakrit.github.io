<!-- Firebase -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
  import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged }
    from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
  import { getFirestore, doc, setDoc, getDoc, onSnapshot }
    from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey:            "AIzaSyD-Vgayvdkl165ZO6kYCfv2OOfvZHqB59g",
    authDomain:        "necomart-github.firebaseapp.com",
    projectId:         "necomart-github",
    storageBucket:     "necomart-github.firebasestorage.app",
    messagingSenderId: "181730496545",
    appId:             "1:181730496545:web:022815a30d6aafd4c65360"
  };

  let app, auth, db, currentUser = null, unsubSnap = null;

  try {
    app  = initializeApp(firebaseConfig);
    auth = getAuth(app);
    db   = getFirestore(app);
    window._fbReady = true;
  } catch(e) {
    console.warn('Firebase init failed (config ยังไม่ได้ตั้ง):', e.message);
    window._fbReady = false;
  }

  if (window._fbReady) {
    onAuthStateChanged(auth, async user => {
      currentUser = user;
      if (user) {
        // Logged in
        document.getElementById('auth-login-btn').classList.add('hidden');
        const wrap = document.getElementById('auth-user-wrap');
        wrap.style.display = 'flex';
        wrap.classList.remove('hidden');
        document.getElementById('auth-avatar').src = user.photoURL || '';
        document.getElementById('auth-name').textContent = user.displayName?.split(' ')[0] || 'ผู้ใช้';
        // ── Listen to cloud sessions ──
        if (unsubSnap) unsubSnap();
        unsubSnap = onSnapshot(doc(db, 'necoPay_users', user.uid), snap => {
          if (snap.exists()) {
            const data = snap.data();
            if (data.sessions) {
              window._cloudSessions = data.sessions;
              // Merge: cloud takes priority for sessions, keep local draft as-is
              const localIds = new Set((window._localSessions||[]).map(s=>s.id));
              const merged = [...data.sessions];
              (window._localSessions||[]).forEach(s => { if(!localIds.has(s.id)) merged.push(s); });
              sessions = merged.sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,30);
              localStorage.setItem('necoPay_sessions', JSON.stringify(sessions));
            }
          }
        });
      } else {
        // Logged out
        document.getElementById('auth-login-btn').classList.remove('hidden');
        const wrap = document.getElementById('auth-user-wrap');
        wrap.style.display = 'none';
        wrap.classList.add('hidden');
        if (unsubSnap) { unsubSnap(); unsubSnap = null; }
      }
    });

    window.googleLogin = async () => {
      try {
        const provider = new GoogleAuthProvider();
        await signInWithPopup(auth, provider);
        showToast('✅ เข้าสู่ระบบแล้ว!');
      } catch(e) { showToast('❌ Login ไม่สำเร็จ: ' + e.message); }
    };

    window.googleLogout = async () => {
      await signOut(auth);
      showToast('👋 ออกจากระบบแล้ว');
    };

    // Expose save-to-cloud
    window.saveToCloud = async (sessionList) => {
      if (!currentUser) return;
      try {
        await setDoc(doc(db, 'necoPay_users', currentUser.uid), { sessions: sessionList }, { merge: true });
      } catch(e) { console.warn('Cloud save failed:', e.message); }
    };
  } else {
    window.googleLogin  = () => showToast('⚠️ ตั้งค่า Firebase config ก่อนนะ!');
    window.googleLogout = () => {};
    window.saveToCloud  = () => {};
  }
</script>

<script>
// ========== STATE ==========
let members = [];
let items = [];
let paidStatus = {}; // { memberId: true/false }
let sessions = JSON.parse(localStorage.getItem('necoPay_sessions') || '[]');
window._localSessions = sessions;

const COLORS = [
  '#6366f1','#f59e0b','#ec4899','#10b981','#3b82f6','#f97316','#8b5cf6','#14b8a6',
  '#e11d48','#84cc16','#06b6d4','#a855f7','#f43f5e','#22c55e','#0ea5e9','#d946ef',
  '#fb923c','#4ade80','#818cf8','#2dd4bf'
];

// ========== INIT ==========
function init() {
  // Load theme
  if (localStorage.getItem('necoPay_theme') === 'dark') {
    document.documentElement.classList.add('dark');
    document.getElementById('theme-icon').textContent = '🌙';
  }

  // Load draft
  const draft = JSON.parse(localStorage.getItem('necoPay_draft') || 'null');
  if (draft) {
    members = draft.members || [];
    items = draft.items || [];
    paidStatus = draft.paidStatus || {};
  } else {
    // Default members
    members = [{ id: uid(), name: 'คน A' }, { id: uid(), name: 'คน B' }];
    items = [{ id: uid(), name: '', price: '', memberIds: members.map(m => m.id) }];
    paidStatus = {};
  }

  renderMembers();
  renderItems();
  calculate();
}

// ========== UTILS ==========
function uid() { return Math.random().toString(36).slice(2,9); }
function fmt(n) { return Number(n).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
function saveDraft() {
  localStorage.setItem('necoPay_draft', JSON.stringify({ members, items, paidStatus }));
}
function showToast(msg) {
  const t = document.getElementById('toast');
  document.getElementById('toast-msg').textContent = msg;
  t.style.transform = 'translateX(-50%) translateY(0)';
  t.style.opacity = '1';
  setTimeout(() => { t.style.transform = 'translateX(-50%) translateY(-6rem)'; t.style.opacity = '0'; }, 2800);
}
function colorOf(idx) { return COLORS[idx % COLORS.length]; }
function memberIdx(id) { return members.findIndex(m => m.id === id); }

// ========== MATH EVAL ==========
// Safely evaluate simple arithmetic expressions like "120+80/2*3"
function evaluateMath(expr) {
  if (!expr && expr !== 0) return 0;
  const str = String(expr).trim().replace(/\s/g, '').replace(/[^\d+\-*/().]/g, '');
  if (!str) return 0;
  try {
    // Guard: only allow digits and operators
    if (!/^[\d+\-*/.()]+$/.test(str)) return parseFloat(str) || 0;
    const result = Function('"use strict"; return (' + str + ')')();
    return isFinite(result) && result >= 0 ? result : 0;
  } catch { return parseFloat(str) || 0; }
}

// ========== THEME ==========
function toggleTheme() {
  const isDark = document.documentElement.classList.toggle('dark');
  document.getElementById('theme-icon').textContent = isDark ? '🌙' : '☀️';
  localStorage.setItem('necoPay_theme', isDark ? 'dark' : 'light');
}

// ========== MEMBERS ==========
function renderMembers() {
  const area = document.getElementById('members-area');
  area.innerHTML = '';
  members.forEach((m, i) => {
    const div = document.createElement('div');
    div.className = 'flex items-center gap-1 bg-white dark:bg-darkCard border-2 rounded-2xl px-3 py-1.5 shadow-sm transition-all animate-pop';
    div.style.borderColor = colorOf(i);
    div.style.animationDelay = (i * 0.05) + 's';
    div.innerHTML = `
      <span class="w-4 h-4 rounded-full flex-shrink-0" style="background:${colorOf(i)}"></span>
      <input type="text" value="${m.name}" placeholder="ชื่อ" maxlength="12"
        class="bg-transparent font-black text-sm w-20 focus:outline-none text-slate-700 dark:text-white"
        oninput="renameMember('${m.id}',this.value)">
      <button onclick="removeMember('${m.id}')" class="text-slate-300 hover:text-red-400 transition-colors text-xs ml-1 font-bold">✕</button>
    `;
    area.appendChild(div);
  });
}

function addMember() {
  if (members.length >= 20) { showToast('⚠️ รองรับสูงสุด 20 คน'); return; }
  const m = { id: uid(), name: 'คน ' + String.fromCharCode(65 + (members.length % 26)) };
  members.push(m);
  renderMembers(); renderItems(); calculate(); saveDraft();
  showToast('✅ เพิ่มคนแล้ว!');
}

function removeMember(id) {
  if (members.length <= 1) { showToast('❌ ต้องมีอย่างน้อย 1 คน'); return; }
  members = members.filter(m => m.id !== id);
  items.forEach(it => { it.memberIds = it.memberIds.filter(mid => mid !== id); });
  renderMembers(); renderItems(); calculate(); saveDraft();
}

function renameMember(id, name) {
  const m = members.find(m => m.id === id);
  if (m) m.name = name;
  // Re-render chips inside items without full re-render
  document.querySelectorAll(`.chip-name-${id}`).forEach(el => el.textContent = name || '?');
  calculate(); // recalculates and calls renderSummary(totals) properly
  saveDraft();
}

// ========== ITEMS ==========
function buildItemRow(it, animate = false) {
  const row = document.createElement('div');
  row.id = 'item-row-' + it.id;
  row.className = 'item-row bg-slate-50 dark:bg-blue-950/20 rounded-2xl border border-slate-200 dark:border-blue-900/40 p-3 space-y-2' + (animate ? ' animate-pop' : '');

  const chipsHtml = members.map((m, mi) => {
    const active = it.memberIds.includes(m.id);
    return `<button type="button" onclick="toggleMemberOnItem('${it.id}','${m.id}')"
      class="member-chip ${active ? 'active' : 'inactive'} chip-item-${it.id}"
      style="${active ? 'background:' + colorOf(mi) + ';border-color:' + colorOf(mi) : 'border-color:' + colorOf(mi)};color:${active ? '#fff' : colorOf(mi)}"
      data-mid="${m.id}">
      <span class="chip-name-${m.id}">${m.name || '?'}</span>
    </button>`;
  }).join('');

  row.innerHTML = `
    <div class="grid grid-cols-[1fr_100px_32px] gap-2 items-center">
      <input type="text" value="${it.name}" placeholder="ชื่อรายการ (เช่น ข้าว, แอร์)" maxlength="30"
        class="bg-transparent font-bold text-sm focus:outline-none text-slate-700 dark:text-white placeholder-slate-300 dark:placeholder-slate-600 min-w-0 item-name-input"
        data-item-id="${it.id}"
        oninput="updateItemName('${it.id}',this.value)">
      <div class="relative flex items-center">
        <span class="absolute left-2 text-slate-400 dark:text-slate-500 text-xs font-bold">฿</span>
        <input type="text" inputmode="decimal" value="${it.price}" placeholder="0.00 หรือ 50+30"
          class="w-full bg-white dark:bg-darkCard border border-slate-200 dark:border-blue-800 rounded-xl pl-5 pr-2 py-1.5 font-black text-sm text-right focus:outline-none focus:border-brand dark:focus:border-green-400 hide-arrows item-price-input"
          data-item-id="${it.id}"
          oninput="updateItemPrice('${it.id}',this.value)">
        <div class="math-preview" id="math-preview-${it.id}" style="opacity:0;position:absolute;top:-28px;right:0"></div>
      </div>
      <button onclick="removeItem('${it.id}')" class="w-8 h-8 flex items-center justify-center rounded-full text-slate-300 hover:text-red-400 hover:bg-red-50 dark:hover:bg-red-900/20 transition-all font-bold">✕</button>
    </div>
    <div class="flex flex-wrap gap-1.5 pt-1 border-t border-slate-100 dark:border-slate-800">
      <span class="text-[10px] font-black text-slate-400 dark:text-slate-500 self-center mr-1">หาร:</span>
      ${chipsHtml}
      <button onclick="toggleAllOnItem('${it.id}')" class="text-[10px] font-bold text-slate-400 hover:text-brand dark:hover:text-green-300 px-2 py-0.5 rounded-lg border border-dashed border-slate-200 dark:border-slate-700 transition-colors">All</button>
    </div>
  `;

  // Enter key navigation
  const nameInput  = row.querySelector('.item-name-input');
  const priceInput = row.querySelector('.item-price-input');
  nameInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); priceInput.focus(); priceInput.select(); }
  });
  priceInput.addEventListener('keydown', e => {
    if (e.key !== 'Enter') return;
    e.preventDefault();
    const allPrices = [...document.querySelectorAll('.item-price-input')];
    const idx = allPrices.indexOf(priceInput);
    if (idx < allPrices.length - 1) {
      document.querySelectorAll('.item-name-input')[idx + 1]?.focus();
    } else {
      addItem();
    }
  });

  return row;
}

function renderItems() {
  const area = document.getElementById('items-area');
  area.innerHTML = '';
  items.forEach(it => area.appendChild(buildItemRow(it, false)));
}

function addItem() {
  const it = { id: uid(), name: '', price: '', memberIds: [] };
  items.push(it);
  // append แค่ row ใหม่ — animate เฉพาะตัวนี้
  document.getElementById('items-area').appendChild(buildItemRow(it, true));
  calculate(); saveDraft();
  setTimeout(() => {
    const nameInputs = document.querySelectorAll('.item-name-input');
    if (nameInputs.length) nameInputs[nameInputs.length - 1].focus();
  }, 50);
}

function removeItem(id) {
  items = items.filter(it => it.id !== id);
  if (!items.length) addItem();
  else { renderItems(); calculate(); saveDraft(); }
}

function updateItemName(id, val) {
  const it = items.find(i => i.id === id);
  if (it) it.name = val;
  calculate(); saveDraft();
}

function updateItemPrice(id, val) {
  const it = items.find(i => i.id === id);
  if (it) it.price = val;

  // Show math preview bubble if expression contains operators
  const preview = document.getElementById('math-preview-' + id);
  if (preview) {
    const hasMath = /[+\-*/]/.test(val) && val.trim() !== '';
    if (hasMath) {
      const result = evaluateMath(val);
      preview.textContent = '= ' + fmt(result) + ' ฿';
      preview.style.opacity = '1';
    } else {
      preview.style.opacity = '0';
    }
  }

  calculate(); saveDraft();
}

function toggleMemberOnItem(itemId, memberId) {
  const it = items.find(i => i.id === itemId);
  if (!it) return;
  const has = it.memberIds.includes(memberId);
  if (has) {
    it.memberIds = it.memberIds.filter(mid => mid !== memberId);
  } else {
    it.memberIds.push(memberId);
  }
  // Update chip visually without full re-render
  const mi = memberIdx(memberId);
  document.querySelectorAll(`.chip-item-${itemId}[data-mid="${memberId}"]`).forEach(btn => {
    const newActive = it.memberIds.includes(memberId);
    btn.className = `member-chip ${newActive ? 'active' : 'inactive'} chip-item-${itemId}`;
    btn.style.background = newActive ? colorOf(mi) : '';
    btn.style.borderColor = colorOf(mi);
    btn.style.color = newActive ? '#fff' : colorOf(mi);
  });
  calculate(); saveDraft();
}

function toggleAllOnItem(itemId) {
  const it = items.find(i => i.id === itemId);
  if (!it) return;
  const allSelected = members.every(m => it.memberIds.includes(m.id));
  it.memberIds = allSelected ? [] : members.map(m => m.id);
  renderItems(); calculate(); saveDraft();
}

function clearItems() {
  items = [{ id: uid(), name: '', price: '', memberIds: members.map(m => m.id) }];
  paidStatus = {};
  renderItems(); calculate(); saveDraft();
  showToast('🗑️ ล้างรายการแล้ว');
}

// ========== PAID STATUS ==========
function togglePaid(memberId) {
  paidStatus[memberId] = !paidStatus[memberId];
  saveDraft();
  calculate(); // re-render summary with new paid state

  const m = members.find(m => m.id === memberId);
  if (paidStatus[memberId]) {
    showToast(`✅ ${m?.name || 'คนนี้'} จ่ายแล้ว!`);
  } else {
    showToast(`↩️ ${m?.name || 'คนนี้'} ยกเลิกการจ่าย`);
  }

  // Auto-save to history when everyone has paid
  const allPaid = members.length > 0 && members.every(m => paidStatus[m.id]);
  if (allPaid) {
    setTimeout(() => {
      saveSession();
      showToast('🎉 ทุกคนจ่ายครบ — บันทึก history อัตโนมัติแล้ว!');
    }, 600);
  }
}
function calculate() {
  const totals = {};
  members.forEach(m => totals[m.id] = 0);

  let grand = 0;
  items.forEach(it => {
    const price = evaluateMath(it.price);   // ← supports +-*/
    grand += price;
    const share = it.memberIds.length > 0 ? price / it.memberIds.length : 0;
    it.memberIds.forEach(mid => { if (totals[mid] !== undefined) totals[mid] += share; });
  });

  document.getElementById('grand-total').textContent = fmt(grand);
  renderSummary(totals);
  return { totals, grand };
}

function renderSummary(totals) {
  if (!totals) return;
  const area = document.getElementById('summary-area');
  area.innerHTML = '';

  let unpaidTotal = 0;
  members.forEach((m, i) => {
    const amt = totals[m.id] || 0;
    const isPaid = !!paidStatus[m.id];
    if (!isPaid) unpaidTotal += amt;

    const div = document.createElement('div');
    div.className = `flex items-center justify-between bg-white dark:bg-darkCard rounded-2xl p-4 border-l-4 shadow-sm animate-pop transition-all ${isPaid ? 'paid-card' : ''}`;
    div.style.borderLeftColor = isPaid ? '#94a3b8' : colorOf(i);
    div.style.animationDelay = (i * 0.06) + 's';
    div.innerHTML = `
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-full flex items-center justify-center font-black text-sm shadow-md transition-all" 
          style="background:${isPaid ? '#94a3b8' : colorOf(i)};color:#fff">${(m.name||'?')[0].toUpperCase()}</div>
        <div>
          <div class="font-black text-sm transition-all ${isPaid ? 'text-slate-400 dark:text-slate-500 paid-strike' : 'text-slate-700 dark:text-white'}">${m.name || '?'}</div>
          <div class="text-[10px] font-bold mt-0.5 ${isPaid ? 'text-slate-300 dark:text-slate-600' : 'text-slate-400 dark:text-slate-500'}">${countItemsForMember(m.id)} รายการ</div>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <div class="text-right">
          <div class="font-black text-xl transition-all ${isPaid ? 'text-slate-300 dark:text-slate-600 line-through' : ''}" style="color:${isPaid ? '' : colorOf(i)}">${fmt(amt)} <span class="text-sm font-bold text-slate-400">฿</span></div>
          ${isPaid ? '<div class="text-[10px] font-black text-emerald-500 dark:text-emerald-400">✓ จ่ายแล้ว</div>' : '<div class="text-[10px] font-bold text-slate-300 dark:text-slate-600">ยังไม่จ่าย</div>'}
        </div>
        <button onclick="togglePaid('${m.id}')" class="paid-toggle w-9 h-9 rounded-xl flex items-center justify-center text-lg border-2 transition-all
          ${isPaid ? 'bg-emerald-50 dark:bg-emerald-900/30 border-emerald-300 dark:border-emerald-700' : 'bg-slate-50 dark:bg-slate-800 border-slate-200 dark:border-slate-700 hover:border-emerald-300 hover:bg-emerald-50 dark:hover:bg-emerald-900/20'}"
          title="${isPaid ? 'แตะเพื่อยกเลิก' : 'แตะเพื่อทำเครื่องหมายจ่ายแล้ว'}">
          ${isPaid ? '✅' : '⬜'}
        </button>
      </div>
    `;
    area.appendChild(div);
  });

  // Update unpaid remaining display
  const unpaidEl = document.getElementById('unpaid-remaining');
  const unpaidWrap = document.getElementById('unpaid-wrap');
  if (unpaidEl && unpaidWrap) {
    const allPaid = members.every(m => paidStatus[m.id]);
    if (allPaid) {
      unpaidWrap.innerHTML = `<div class="text-center py-2 animate-pop"><span class="text-2xl">🎉</span> <span class="font-black text-emerald-500 dark:text-emerald-400">ทุกคนจ่ายครบแล้ว!</span></div>`;
    } else {
      unpaidEl.textContent = fmt(unpaidTotal);
    }
  }
}

function countItemsForMember(mid) {
  return items.filter(it => it.memberIds.includes(mid) && evaluateMath(it.price) > 0).length;
}

// ========== RECEIPT ==========
// รับ session object ก็ได้ หรือไม่ส่งก็ใช้ state ปัจจุบัน
function openReceipt(sessionData) {
  const src = sessionData || null;
  const _members = src ? src.members : members;
  const _items   = src ? src.items   : items;
  const _paid    = src ? (src.paidStatus || {}) : paidStatus;
  const _grand   = src ? src.grand   : calculate().grand;
  const _totals  = src ? src.totals  : calculate().totals;

  const now = src ? new Date(src.date) : new Date();
  document.getElementById('r-date').textContent = now.toLocaleDateString('th-TH',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
  document.getElementById('r-id').textContent = 'ID: ' + (src ? src.id.toUpperCase() : Math.random().toString(36).slice(2,11).toUpperCase());

  const rItems = document.getElementById('r-items');
  rItems.innerHTML = '';
  let hasItems = false;
  _items.forEach(it => {
    const price = evaluateMath(it.price);
    if (!it.name && !price) return;
    hasItems = true;
    const div = document.createElement('div');
    div.className = 'flex justify-between gap-2';
    const hasExpr = /[+\-*/]/.test(it.price||'');
    const label = hasExpr ? `${it.name||'(ไม่มีชื่อ)'} <span style="color:#9ca3af;font-size:9px">(${it.price})</span>` : (it.name||'(ไม่มีชื่อ)');
    div.innerHTML = `<span class="flex-1">${label}</span><span class="font-bold flex-shrink-0">${fmt(price)}</span>`;
    rItems.appendChild(div);
    const who = _members.filter(m => it.memberIds.includes(m.id)).map(m => m.name).join(', ');
    const sub = document.createElement('div');
    sub.className = 'text-[9px] text-gray-400 pl-2';
    sub.textContent = '↳ หาร: ' + (who||'-');
    rItems.appendChild(sub);
  });
  if (!hasItems) rItems.innerHTML = '<div class="text-gray-400 text-center py-2">ไม่มีรายการ</div>';

  const rMembers = document.getElementById('r-members');
  rMembers.innerHTML = '';
  _members.forEach((m,i) => {
    const isPaid = !!_paid[m.id];
    const div = document.createElement('div');
    div.className = 'flex justify-between font-bold items-start gap-2';
    div.innerHTML = `
      <span style="color:${colorOf(i)}" class="${isPaid?'line-through opacity-50':''}">${m.name}</span>
      <span class="flex items-center gap-1.5">
        <span class="${isPaid?'line-through opacity-50':''}">${fmt(_totals[m.id]||0)} ฿</span>
        <span class="text-[10px]">${isPaid?'✅':'⬜'}</span>
      </span>`;
    rMembers.appendChild(div);
  });
  const totalRow = document.createElement('div');
  totalRow.className = 'flex justify-between font-black text-base pt-2 border-t border-black mt-2';
  totalRow.innerHTML = `<span>รวม</span><span>${fmt(_grand)} ฿</span>`;
  rMembers.appendChild(totalRow);

  const modal = document.getElementById('receipt-modal');
  modal.style.display = 'flex';
  setTimeout(() => { modal.style.opacity = '1'; }, 10);
}

function closeReceiptModal() {
  const modal = document.getElementById('receipt-modal');
  modal.style.opacity = '0';
  setTimeout(() => { modal.style.display = 'none'; }, 300);
}

document.getElementById('dl-btn').addEventListener('click', async () => {
  const area = document.getElementById('receipt-area');
  try {
    const canvas = await html2canvas(area, { scale: 3, backgroundColor: '#ffffff', useCORS: true });
    const link = document.createElement('a');
    link.download = 'necopay-receipt-' + Date.now() + '.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
    showToast('📸 บันทึกรูปใบเสร็จแล้ว!');
  } catch(e) { showToast('❌ ไม่สามารถบันทึกได้'); }
});

// ========== PAID IN HISTORY ==========
function togglePaidInHistory(sessionId, memberId, e) {
  if (e) e.stopPropagation();
  const s = sessions.find(s => s.id === sessionId);
  if (!s) return;
  if (!s.paidStatus) s.paidStatus = {};
  s.paidStatus[memberId] = !s.paidStatus[memberId];
  const allPaid = s.members.every(m => s.paidStatus[m.id]);
  localStorage.setItem('necoPay_sessions', JSON.stringify(sessions));
  if (window.saveToCloud) window.saveToCloud(sessions);
  // Re-render แค่ card นั้น ไม่ให้หน้ากระตุก
  const existing = document.getElementById('hcard-' + sessionId);
  if (existing) existing.replaceWith(buildHistoryCard(s));
  const m = s.members.find(m => m.id === memberId);
  if (s.paidStatus[memberId]) {
    showToast(`✅ ${m?.name||'คนนี้'} จ่ายแล้ว!`);
    if (allPaid) setTimeout(() => showToast('🎉 ทุกคนจ่ายครบ!'), 700);
  } else {
    showToast(`↩️ ${m?.name||'คนนี้'} ยกเลิกการจ่าย`);
  }
}

function buildHistoryCard(s) {
  const d = new Date(s.date);
  const isOnline = !!s.synced;
  const allPaid = s.members.length > 0 && s.members.every(m => s.paidStatus?.[m.id]);

  const card = document.createElement('div');
  card.id = 'hcard-' + s.id;
  card.className = `bg-white dark:bg-darkCard rounded-2xl border-2 p-4 space-y-2 transition-all ${isOnline?'session-online':'session-offline'}`;
  card.innerHTML = `
    <div class="flex justify-between items-start gap-2">
      <div class="flex-1 min-w-0">
        <div class="flex items-center gap-2 flex-wrap">
          <div class="font-black text-slate-700 dark:text-white text-sm">${d.toLocaleDateString('th-TH',{day:'2-digit',month:'short',year:'numeric'})} ${d.toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'})}</div>
          <span class="${isOnline?'badge-online':'badge-offline'}">${isOnline?'☁️ cloud':'📴 ออฟไลน์'}</span>
          ${allPaid?'<span class="badge-online">🎉 ครบแล้ว</span>':''}
        </div>
        <div class="text-[11px] text-slate-400 dark:text-slate-500 font-bold mt-0.5 truncate">${s.members.map(m=>m.name).join(', ')} · ${s.items.filter(i=>i.price).length} รายการ</div>
      </div>
      <div class="text-right shrink-0">
        <div class="font-black text-brand dark:text-green-300">${fmt(s.grand)} ฿</div>
        <button onclick="deleteSession('${s.id}',event)" class="text-[10px] text-red-400 hover:text-red-600 font-bold transition-colors">ลบ</button>
      </div>
    </div>
    <div class="grid grid-cols-2 sm:grid-cols-3 gap-1.5">
      ${s.members.map((m,mi) => {
        const isPaid = !!(s.paidStatus?.[m.id]);
        return `<button onclick="togglePaidInHistory('${s.id}','${m.id}',event)"
          class="flex items-center gap-1.5 rounded-xl px-2 py-1.5 w-full transition-all active:scale-95
            ${isPaid?'bg-emerald-50 dark:bg-emerald-900/30 border border-emerald-200 dark:border-emerald-800':'bg-slate-50 dark:bg-blue-950/30 border border-slate-200 dark:border-slate-700 hover:border-emerald-300 dark:hover:border-emerald-700'}">
          <div class="w-2.5 h-2.5 rounded-full flex-shrink-0" style="background:${colorOf(mi)}"></div>
          <div class="text-[11px] font-bold truncate flex-1 ${isPaid?'text-emerald-700 dark:text-emerald-300 line-through opacity-70':'text-slate-600 dark:text-slate-300'}">${m.name}</div>
          <span class="text-[11px] ml-auto flex-shrink-0">${isPaid?'✅':'<span style="color:'+colorOf(mi)+'" class="font-black">'+fmt(s.totals[m.id]||0)+'฿</span>'}</span>
        </button>`;
      }).join('')}
    </div>
    <div class="flex gap-2 pt-0.5">
      <button onclick="openReceipt(sessions.find(s=>s.id==='${s.id}'))" class="flex-1 text-[11px] font-black text-slate-500 dark:text-slate-400 py-1.5 border border-dashed border-slate-200 dark:border-slate-700 rounded-xl hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors flex items-center justify-center gap-1">🧾 ใบเสร็จ</button>
      <button onclick="loadSession('${s.id}',event)" class="flex-1 text-[11px] font-black text-brand dark:text-green-300 py-1.5 border border-dashed border-brand/30 dark:border-green-700/40 rounded-xl hover:bg-green-50 dark:hover:bg-green-900/20 transition-colors flex items-center justify-center gap-1">📂 โหลดมาแก้ต่อ</button>
      ${!isOnline?`<button onclick="uploadSession('${s.id}',event)" class="text-[11px] font-black text-orange-500 py-1.5 px-3 border border-dashed border-orange-300 dark:border-orange-700/40 rounded-xl hover:bg-orange-50 dark:hover:bg-orange-900/20 transition-colors">☁️</button>`:''}
    </div>
  `;
  return card;
}

// ========== SAVE SESSION ==========
function saveSession() {
  const { totals, grand } = calculate();
  const isLoggedIn = !!(document.getElementById('auth-user-wrap') && !document.getElementById('auth-user-wrap').classList.contains('hidden'));
  const session = {
    id: uid(),
    date: new Date().toISOString(),
    members: JSON.parse(JSON.stringify(members)),
    items: JSON.parse(JSON.stringify(items)),
    totals: { ...totals },
    paidStatus: { ...paidStatus },
    grand,
    synced: isLoggedIn
  };
  sessions.unshift(session);
  if (sessions.length > 30) sessions.pop();
  localStorage.setItem('necoPay_sessions', JSON.stringify(sessions));
  window._localSessions = sessions;

  if (isLoggedIn && window.saveToCloud) {
    window.saveToCloud(sessions);
    showToast('☁️ บันทึกแล้ว — ซิงค์ cloud เรียบร้อย!');
  } else {
    showToast('💾 บันทึกแล้ว (ออฟไลน์)');
  }
}

// Upload a single offline session to cloud
async function uploadSession(id, e) {
  if (e) e.stopPropagation();
  if (!window.saveToCloud) { showToast('⚠️ ต้องล็อกอินก่อน'); return; }
  const s = sessions.find(s => s.id === id);
  if (!s) return;
  s.synced = true;
  localStorage.setItem('necoPay_sessions', JSON.stringify(sessions));
  await window.saveToCloud(sessions);
  showToast('☁️ อัปโหลดแล้ว!');
  openHistoryModal(); // re-render
}

// ========== HISTORY MODAL ==========
function openHistoryModal() {
  sessions = JSON.parse(localStorage.getItem('necoPay_sessions') || '[]');
  const list = document.getElementById('history-list');
  list.innerHTML = '';
  if (!sessions.length) {
    list.innerHTML = '<div class="text-center text-slate-400 dark:text-slate-500 font-bold py-8 text-sm">🪹 ยังไม่มีประวัติการหาร</div>';
  } else {
    sessions.forEach(s => list.appendChild(buildHistoryCard(s)));
  }
  const modal = document.getElementById('history-modal');
  modal.style.display = 'flex';
  setTimeout(() => { modal.style.opacity = '1'; }, 10);
}

function closeHistoryModal() {
  const modal = document.getElementById('history-modal');
  modal.style.opacity = '0';
  setTimeout(() => { modal.style.display = 'none'; }, 300);
}

function loadSession(id, e) {
  if(e) e.stopPropagation();
  const s = sessions.find(s => s.id === id);
  if (!s) return;
  members = JSON.parse(JSON.stringify(s.members));
  items = JSON.parse(JSON.stringify(s.items));
  paidStatus = JSON.parse(JSON.stringify(s.paidStatus || {}));
  renderMembers(); renderItems(); calculate(); saveDraft();
  closeHistoryModal();
  showToast('📂 โหลดรอบนั้นแล้ว!');
}

function deleteSession(id, e) {
  if(e) e.stopPropagation();
  sessions = sessions.filter(s => s.id !== id);
  localStorage.setItem('necoPay_sessions', JSON.stringify(sessions));
  if (window.saveToCloud) window.saveToCloud(sessions);
  openHistoryModal();
  showToast('🗑️ ลบแล้ว');
}

// ========== CLICK OUTSIDE MODALS ==========
document.getElementById('receipt-modal').addEventListener('click', function(e) {
  if (e.target === this) closeReceiptModal();
});
document.getElementById('history-modal').addEventListener('click', function(e) {
  if (e.target === this) closeHistoryModal();
});

// ========== START ==========
init();
</script>
